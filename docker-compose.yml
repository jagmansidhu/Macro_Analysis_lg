services:
  db:
    image: pgvector/pgvector:pg17
    container_name: local-pgvector
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: local_agent_db
    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data: