[project]
name = "simple-agent-template"
version = "0.1.0"
description = "Minimal LangChain agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "firecrawl-py>=1.0.0",
    "httpx>=0.27.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.8",
    "langchain-google-genai>=4.2.5",
    "langchain-openai>=1.3.3",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.1",
    "tavily-python>=0.3.0",
    "watchdog>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "graph"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]

